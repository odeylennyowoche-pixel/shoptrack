{% extends "base.html" %}

{% block content %}
<h1>Add Product</h1>

<div class="card">
    <form method="POST">
        <label>Name <input type="text" name="name" required></label>
        <label>Selling price (₦) <input type="number" name="price" step="0.01" min="0" required></label>
        <label>Cost price (₦) <input type="number" name="cost" step="0.01" min="0" required></label>
        <label>Stock quantity <input type="number" name="stock" min="0" required></label>
        <label>Low stock warning level <input type="number" name="low_stock_level" value="5" min="0" required></label>
        <button type="submit" class="btn">Save Product</button>
    </form>
</div>
{% endblock %}
